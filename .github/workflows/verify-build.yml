name: Verify build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, rebuild/os-economy-room]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run economy tests
        run: npm test
      - name: Type-check and build production bundle
        run: npm run build
